<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản của tôi - Warlergen Shop</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 119, 48, 0.1) 0%, transparent 50%);
      animation: backgroundPulse 15s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes backgroundPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      border-radius: 15px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg, #ff7730, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-header {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      margin-left: 10px;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .page-title {
      text-align: center;
      font-size: 36px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #ff7730, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .account-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .account-card {
      background: rgba(26, 31, 58, 0.6);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 30px;
    }

    .profile-section {
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #ff7730, #ffd700);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .username {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff7730, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-since {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .balance-box {
      background: linear-gradient(135deg, rgba(255, 119, 48, 0.2), rgba(255, 215, 0, 0.2));
      border: 2px solid rgba(255, 119, 48, 0.3);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }

    .balance-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .balance-amount {
      font-size: 32px;
      font-weight: bold;
      color: #ffd700;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #ff7730, #ff9d5c);
      border: none;
      border-radius: 10px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 119, 48, 0.3);
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #ff7730;
      border-bottom: 2px solid rgba(255, 119, 48, 0.3);
      padding-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .stat-label {
      color: #aaa;
    }

    .stat-value {
      font-weight: bold;
      color: #ffd700;
    }

    .orders-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .order-item {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #ff7730;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: bold;
      color: #ff7730;
    }

    .order-status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-pending { background: rgba(255,165,0,0.2); color: #ffa500; }
    .status-processing { background: rgba(0,191,255,0.2); color: #00bfff; }
    .status-completed { background: rgba(0,255,0,0.2); color: #0f0; }

    .order-info {
      font-size: 14px;
      color: #ddd;
    }

    .btn-logout {
      background: linear-gradient(135deg, #f00, #c00) !important;
    }

    @media (max-width: 768px) {
      .account-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">👤 Tài Khoản Của Tôi</div>
      <div>
        <button class="btn-header" onclick="window.location.href='index.html'">🏠 Trang chủ</button>
      </div>
    </header>

    <h1 class="page-title">Thông Tin Tài Khoản</h1>

    <div class="account-grid">
      <!-- Profile Card -->
      <div class="account-card profile-section">
        <div class="avatar">👤</div>
        <div class="username" id="username">Loading...</div>
        <div class="user-since" id="userSince">Thành viên từ: ...</div>

        <div class="balance-box">
          <div class="balance-label">💰 Số dư tài khoản</div>
          <div class="balance-amount" id="balance">0đ</div>
        </div>

        <button class="btn-action" onclick="window.location.href='naptien.html'">💳 Nạp tiền</button>
        <button class="btn-action btn-logout" onclick="handleLogout()">🚪 Đăng xuất</button>
      </div>

      <!-- Stats & Orders -->
      <div class="account-card">
        <div class="section-title">📊 Thống kê</div>
        
        <div class="stat-row">
          <span class="stat-label">Tổng đơn hàng</span>
          <span class="stat-value" id="totalOrders">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Đang xử lý</span>
          <span class="stat-value" id="processingOrders">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Đã hoàn thành</span>
          <span class="stat-value" id="completedOrders">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Tổng chi tiêu</span>
          <span class="stat-value" id="totalSpent">0đ</span>
        </div>

        <div class="section-title" style="margin-top: 30px;">📦 Đơn hàng gần đây</div>
        
        <div class="orders-list" id="ordersList">
          <div style="text-align: center; color: #aaa; padding: 20px;">Chưa có đơn hàng nào</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Kiểm tra đăng nhập
    const currentUser = localStorage.getItem('currentUser');
    if(!currentUser) {
      alert('Vui lòng đăng nhập!');
      window.location.href = 'login.html';
    }

    // Load thông tin user
    function loadUserInfo() {
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const user = users.find(u => u.username === currentUser);

      if(user) {
        document.getElementById('username').textContent = user.username;
        document.getElementById('userSince').textContent = 
          'Thành viên từ: ' + new Date(user.createdAt).toLocaleDateString('vi-VN');
        document.getElementById('balance').textContent = 
          parseInt(user.balance || 0).toLocaleString('vi-VN') + 'đ';
      }
    }

    // Load thống kê đơn hàng
    function loadOrderStats() {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const myOrders = orders.filter(o => o.username === currentUser);

      const total = myOrders.length;
      const processing = myOrders.filter(o => o.status === 'PROCESSING' || o.status === 'PENDING').length;
      const completed = myOrders.filter(o => o.status === 'COMPLETED').length;
      const totalSpent = myOrders.filter(o => o.status === 'COMPLETED')
                                  .reduce((sum, o) => sum + parseInt(o.price), 0);

      document.getElementById('totalOrders').textContent = total;
      document.getElementById('processingOrders').textContent = processing;
      document.getElementById('completedOrders').textContent = completed;
      document.getElementById('totalSpent').textContent = totalSpent.toLocaleString('vi-VN') + 'đ';

      // Load danh sách đơn
      loadRecentOrders(myOrders);
    }

    // Load đơn hàng gần đây
    function loadRecentOrders(orders) {
      const container = document.getElementById('ordersList');
      
      if(orders.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #aaa; padding: 20px;">Chưa có đơn hàng nào</div>';
        return;
      }

      // Sắp xếp theo mới nhất
      orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      // Chỉ hiển thị 5 đơn gần nhất
      const recentOrders = orders.slice(0, 5);

      let html = '';
      recentOrders.forEach(order => {
        const statusText = {
          'PENDING': 'Đang chờ',
          'PROCESSING': 'Đang xử lý',
          'COMPLETED': 'Hoàn thành',
          'CANCELLED': 'Đã hủy'
        }[order.status];

        const statusClass = 'status-' + order.status.toLowerCase();

        html += `
          <div class="order-item">
            <div class="order-header">
              <span class="order-id">#${order.id}</span>
              <span class="order-status ${statusClass}">${statusText}</span>
            </div>
            <div class="order-info">
              <div><strong>Dịch vụ:</strong> ${getServiceName(order.service)}</div>
              <div><strong>Giá:</strong> ${parseInt(order.price).toLocaleString('vi-VN')}đ</div>
              <div><strong>Ngày:</strong> ${new Date(order.createdAt).toLocaleDateString('vi-VN')}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function getServiceName(service) {
      const names = {
        'level-max': '📈 Cày Max Level',
        'awaken-fruit': '⚡ Awaken Trái',
        'mastery-melee': '🥊 Mastery Melee',
        'mastery-sword': '⚔️ Mastery Sword',
        'farm-fragment': '💎 Farm Fragment',
        'farm-beli': '💰 Farm Beli',
        'sea-event': '🌊 Sea Event'
      };
      return names[service] || service;
    }

    function handleLogout() {
      if(!confirm('Bạn có chắc muốn đăng xuất?')) return;

      localStorage.removeItem('currentUser');
      localStorage.removeItem('userBalance');
      alert('Đã đăng xuất thành công!');
      window.location.href = 'index.html';
    }

    // Load dữ liệu
    loadUserInfo();
    loadOrderStats();
  </script>
</body>
</html>
