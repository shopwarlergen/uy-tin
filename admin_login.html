<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Warlergen</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 32px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }
    .logo p {
      color: #666;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
    }
    .btn-login:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert.show {
      display: block;
    }
    .back-link {
      text-align: center;
      margin-top: 20px;
    }
    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .shield-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="shield-icon">🛡️</div>
    <div class="logo">
      <h1>Admin Panel</h1>
      <p>Warlergen Shop</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>👤 Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập username admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label>🔒 Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Đăng nhập</button>
    </form>

    <div class="back-link">
      <a href="index.html">← Quay về trang chủ</a>
    </div>
  </div>

  <script>
    // ⚠️ THAY ĐỔI URL API
    const API_URL = 'https://yourdomain.com/api';

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert ${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if(!username || !password) {
        showAlert('Vui lòng điền đầy đủ thông tin', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Đang xử lý...';

      try {
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch(`${API_URL}/admin_login.php`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        const data = await response.json();

        if(data.status === 1) {
          showAlert('✅ Đăng nhập thành công!', 'success');
          setTimeout(() => {
            window.location.href = 'admin_orders.html';
          }, 1000);
        } else {
          showAlert('❌ ' + (data.msg || 'Sai tên đăng nhập hoặc mật khẩu'), 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Đăng nhập';
        }

      } catch(error) {
        showAlert('❌ Lỗi kết nối server', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
