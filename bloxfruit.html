<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruit Service</title>
  <style>
    body {background-color: #0d0d0d; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px;}
    header {display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #111;}
    header .logo {font-size: 20px; font-weight: bold;}
    header button {padding: 5px 15px; background-color: #222; color: #fff; border: none; border-radius: 5px; cursor: pointer;}
    header button:hover {background-color: #444;}
    h1 {color: #0f0; margin-bottom: 20px;}
    .info-box {background-color: #222; padding: 20px; border-radius: 10px; display: inline-block; text-align: left; max-width: 400px; width: 100%;}
    p {margin-bottom: 15px;}
    select, input, textarea {width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; background-color: #333; color: #fff;}
    button.action {width: 100%; margin-top: 10px;}
  </style>
</head>
<body>
  <header>
    <div class="logo">Shop</div>
    <button>Nạp tiền</button>
    <button onclick="window.history.back()">Quay lại</button>
  </header>

  <div class="info-box">
    <h1>Blox Fruit - Dịch vụ cày thuê</h1>
    <select onchange="showServices(this.value)">
      <option value="">Chọn dịch vụ</option>
      <option value="1">Dịch vụ 1</option>
      <option value="2">Dịch vụ 2</option>
      <option value="3">Dịch vụ 3</option>
      <option value="4">Dịch vụ 4</option>
      <option value="5">Dịch vụ 5</option>
      <option value="6">Dịch vụ 6</option>
      <option value="7">Dịch vụ 7</option>
    </select>
    <div id="services" style="display:none;">
      <p>Dịch vụ bạn chọn sẽ hiển thị ở đây.</p>
    </div>
    <input type="text" placeholder="Nhập tên tài khoản">
    <input type="password" placeholder="Nhập mật khẩu">
    <textarea placeholder="Ghi chú"></textarea>
    <p>Chúng tôi cung cấp dịch vụ cày thuê Blox Fruit chuyên nghiệp. Nhanh chóng và an toàn!</p>
    <button class="action" onclick="alert('Đã gửi yêu cầu!')">Gửi yêu cầu</button>
  </div>

  <script>
    function showServices(val) {
      const servicesDiv = document.getElementById('services');
      if(val) {
        servicesDiv.style.display = 'block';
        servicesDiv.innerHTML = '<ul>' +
          '<li>Dịch vụ 1</li>' +
          '<li>Dịch vụ 2</li>' +
          '<li>Dịch vụ 3</li>' +
          '<li>Dịch vụ 4</li>' +
          '<li>Dịch vụ 5</li>' +
          '<li>Dịch vụ 6</li>' +
          '<li>Dịch vụ 7</li>' +
          '</ul>';
      } else {
        servicesDiv.style.display = 'none';
      }
    }
  </script>
</body>
</html>
