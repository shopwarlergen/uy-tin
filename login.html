<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Warlergen Shop</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 119, 48, 0.1) 0%, transparent 50%);
      animation: backgroundPulse 15s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes backgroundPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .auth-container {
      background: rgba(26, 31, 58, 0.8);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 119, 48, 0.2);
      max-width: 450px;
      width: 100%;
      border: 1px solid rgba(255, 119, 48, 0.2);
      position: relative;
      z-index: 1;
    }
    .logo {text-align: center; margin-bottom: 30px;}
    .logo h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #ff7730, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .logo p {color: #aaa; font-size: 14px;}
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-weight: 500;
      transition: all 0.3s;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab.active {color: #ff7730; border-bottom-color: #ff7730;}
    .form-content {display: none;}
    .form-content.active {display: block;}
    .form-group {margin-bottom: 20px;}
    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #0f0;
      background: rgba(0,255,0,0.05);
    }
    input::placeholder {color: #666;}
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff7730 0%, #ff9d5c 100%);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(255, 119, 48, 0.3);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 119, 48, 0.5);
    }
    .btn-submit:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }
    .alert.success {
      background: rgba(0,255,0,0.1);
      color: #0f0;
      border: 1px solid #0f0;
    }
    .alert.error {
      background: rgba(255,0,0,0.1);
      color: #f00;
      border: 1px solid #f00;
    }
    .alert.show {display: block;}
    .back-link {text-align: center; margin-top: 20px;}
    .back-link a {color: #ff7730; text-decoration: none; font-size: 14px;}
    .back-link a:hover {text-decoration: underline;}
    .user-icon {font-size: 64px; text-align: center; margin-bottom: 20px;}
    .hint {font-size: 12px; color: #888; margin-top: 5px;}
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="user-icon">🎮</div>
    <div class="logo">
      <h1>Warlergen Shop</h1>
      <p>Dịch vụ cày thuê game uy tín</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Đăng nhập</div>
      <div class="tab" onclick="switchTab('register')">Đăng ký</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- Form đăng nhập -->
    <div id="loginForm" class="form-content active">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>👤 Tên đăng nhập</label>
          <input type="text" id="login_username" placeholder="Nhập username" required>
        </div>
        <div class="form-group">
          <label>🔒 Mật khẩu</label>
          <input type="password" id="login_password" placeholder="Nhập mật khẩu" required>
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">Đăng nhập</button>
      </form>
    </div>

    <!-- Form đăng ký -->
    <div id="registerForm" class="form-content">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>👤 Tên đăng nhập</label>
          <input type="text" id="reg_username" placeholder="Chỉ chữ cái và số" pattern="[a-zA-Z0-9]+" required>
          <div class="hint">Chỉ chữ cái và số, không dấu</div>
        </div>
        <div class="form-group">
          <label>🔒 Mật khẩu</label>
          <input type="password" id="reg_password" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
        </div>
        <div class="form-group">
          <label>🔒 Xác nhận mật khẩu</label>
          <input type="password" id="reg_confirm_password" placeholder="Nhập lại mật khẩu" minlength="6" required>
        </div>
        <button type="submit" class="btn-submit" id="registerBtn">Đăng ký</button>
      </form>
    </div>

    <div class="back-link">
      <a href="index.html">← Quay về trang chủ</a>
    </div>
  </div>

  <script>
    const API_URL = 'api'; // Thư mục chứa PHP

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
      
      if(tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
      
      document.getElementById('alertBox').classList.remove('show');
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert ${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('login_username').value.trim();
      const password = document.getElementById('login_password').value.trim();

      if(!username || !password) {
        showAlert('Vui lòng điền đầy đủ thông tin', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Đang xử lý...';

      try {
        const formData = new FormData();
        formData.append('action', 'login');
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch(`${API_URL}/auth.php`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        const data = await response.json();

        if(data.status === 1) {
          showAlert('✅ Đăng nhập thành công!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          showAlert('❌ ' + (data.msg || 'Đăng nhập thất bại'), 'error');
        }
      } catch(error) {
        showAlert('❌ Lỗi kết nối server', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Đăng nhập';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();

      const username = document.getElementById('reg_username').value.trim();
      const password = document.getElementById('reg_password').value.trim();
      const confirmPassword = document.getElementById('reg_confirm_password').value.trim();

      if(!username || !password || !confirmPassword) {
        showAlert('Vui lòng điền đầy đủ thông tin', 'error');
        return;
      }

      if(!/^[a-zA-Z0-9]+$/.test(username)) {
        showAlert('Tên đăng nhập chỉ được chữ cái và số', 'error');
        return;
      }

      if(password.length < 6) {
        showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'error');
        return;
      }

      if(password !== confirmPassword) {
        showAlert('Mật khẩu xác nhận không khớp', 'error');
        return;
      }

      const registerBtn = document.getElementById('registerBtn');
      registerBtn.disabled = true;
      registerBtn.textContent = 'Đang xử lý...';

      try {
        const formData = new FormData();
        formData.append('action', 'register');
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch(`${API_URL}/auth.php`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        const data = await response.json();

        if(data.status === 1) {
          showAlert('✅ Đăng ký thành công!', 'success');
          document.getElementById('registerForm').querySelector('form').reset();
          
          setTimeout(() => {
            switchTab('login');
            document.getElementById('login_username').value = username;
          }, 2000);
        } else {
          showAlert('❌ ' + (data.msg || 'Đăng ký thất bại'), 'error');
        }
      } catch(error) {
        showAlert('❌ Lỗi kết nối server', 'error');
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Đăng ký';
      }
    }
  </script>
</body>
</html>
