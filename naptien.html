<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nạp tiền</title>
  <style>
    body {background-color: #0d0d0d; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px;}
    header {display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #111; margin-bottom: 30px;}
    header .logo {font-size: 20px; font-weight: bold;}
    header button {padding: 5px 15px; background-color: #222; color: #fff; border: none; border-radius: 5px; cursor: pointer;}
    header button:hover {background-color: #444;}
    .payment-box {background-color: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; text-align: left;}
    h1 {color: #0f0; margin-bottom: 20px; text-align: center;}
    button.method {width: 100%; padding: 10px; margin-bottom: 15px; border: none; border-radius: 5px; background-color: #333; color: #fff; cursor: pointer;}
    button.method:hover {background-color: #444;}
  </style>
</head>
<body>
  <header>
    <div class="logo">Shop</div>
    <button onclick="window.history.back()">Quay lại</button>
  </header>

  <div class="payment-box">
    <h1>Nạp tiền</h1>
    <button class="method" onclick="alert('Nạp tiền bằng thẻ cào')">Nạp tiền bằng thẻ cào</button>
    <button class="method" onclick="alert('Nạp tiền bằng ngân hàng')">Nạp tiền bằng ngân hàng</button>
  </div>
</body>
</html>
